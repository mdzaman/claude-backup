<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="/manifest.webmanifest?t=__TOKEN__">

<title>Claude Backup</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --side: #efede7; --sel: #e3ddd0; --ink: #1f1e1b; --muted: #6b675e; --line: #e4e1d8;
  --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fbeee6;
  --ok: #15803d; --ok-soft: #e7f5ec; --warn: #8a5300; --warn-soft: #fdf6e3; --bad: #b91c1c; --bad-soft: #fdecec;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1917; --panel: #24231f; --side: #1f1e1c; --sel: #3a2a21; --ink: #ecebe6; --muted: #a29e93; --line: #37352f;
    --accent: #f08a5d; --accent-ink: #1a1917; --accent-soft: #3a2a21;
    --ok: #4ade80; --ok-soft: #1d3326; --warn: #facc15; --warn-soft: #3a3318; --bad: #f87171; --bad-soft: #3d2222;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; }
button, input, select { font: inherit; color: inherit; }
aside { width: 220px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 10px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.logo svg { width: 18px; height: 18px; }
.brand b { display: block; font-size: 15px; } .brand small { color: var(--muted); font-size: 11px; }
aside a { display: block; padding: 7px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; margin: 1px 0; }
aside a:hover { background: var(--sel); }
aside a.active { background: var(--sel); font-weight: 600; }
aside .grow { flex: 1; }
aside .foot { padding: 8px 12px; color: var(--muted); font-size: 12px; }
main { flex: 1; min-width: 0; padding: 26px 32px 120px; max-width: 1100px; }
h1 { font-size: 24px; margin: 0 0 2px; } h2 { font-size: 15px; margin: 0 0 4px; } h3 { font-size: 14px; margin: 16px 0 6px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile b { display: block; } .tile .n { font-variant-numeric: tabular-nums; font-size: 13px; margin: 2px 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.row > label.k { min-width: 140px; color: var(--muted); }
.row .grow { flex: 1; min-width: 200px; }
input[type=text], input[type=number], select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
label.opt { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; cursor: pointer; }
label.opt input { margin-top: 3px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 3px 10px; font-size: 12px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.note { padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: 13px; }
.note.info { background: var(--accent-soft); } .note.warn { background: var(--warn-soft); color: var(--warn); }
.note.ok { background: var(--ok-soft); color: var(--ok); } .note.bad { background: var(--bad-soft); color: var(--bad); }
code, .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); } tr.on td { background: var(--sel); }
.scroll { max-height: 380px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); margin: 1px 2px 1px 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.tree { border: 1px solid var(--line); border-radius: 8px; max-height: 420px; overflow: auto; }
.tree details { border-bottom: 1px solid var(--line); } .tree details:last-child { border-bottom: 0; }
.tree summary { list-style: none; display: flex; gap: 8px; align-items: center; padding: 8px 10px; cursor: pointer; font-weight: 600; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .chev { width: 12px; color: var(--muted); transition: transform .15s; }
.tree details[open] .chev { transform: rotate(90deg); }
.tree .meta { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.tree .item { display: flex; gap: 8px; align-items: flex-start; padding: 5px 10px 5px 38px; cursor: pointer; }
.tree .item:hover { background: var(--accent-soft); }
.tree .item small { display: block; color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pane { border: 1px solid var(--line); border-radius: 8px; height: 380px; overflow: auto; background: var(--panel); }
pre.preview { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.files .f { padding: 3px 10px 3px 52px; cursor: pointer; font-family: var(--mono); font-size: 12px; display: flex; gap: 8px; }
.files .f:hover, .files .f.on { background: var(--sel); }
.files .f span:last-child { margin-left: auto; color: var(--muted); }
.files .h { padding: 5px 10px; font-weight: 600; } .files .i { padding: 4px 10px 4px 28px; display: flex; gap: 8px; align-items: center; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 18px; }
.steps span { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.steps span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps span.done { color: var(--ok); border-color: var(--ok); }
.choice { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; cursor: pointer; display: flex; gap: 10px; }
.choice:hover { border-color: var(--accent); }
.choice input { margin-top: 4px; }
.wiznav { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.wiznav .grow { flex: 1; }
#jobbar { position: fixed; left: 220px; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 24px; display: none; align-items: center; gap: 14px; z-index: 5; }
#jobbar.on { display: flex; }
#jobbar .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
#jobbar .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#jobbar .txt { min-width: 260px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
#toasts { position: fixed; right: 18px; top: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 380px; font-size: 13px; }
.toast.ok { border-left-color: var(--ok); } .toast.bad { border-left-color: var(--bad); }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 10; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; border: 1px solid var(--line); width: min(900px, 100%); max-height: 88vh; display: flex; flex-direction: column; }
.modal header { padding: 16px 20px 4px; } .modal .body { padding: 6px 20px; overflow: auto; } .modal footer { padding: 12px 20px 16px; display: flex; gap: 8px; justify-content: flex-end; }
.empty { color: var(--muted); padding: 14px; text-align: center; }
#topbar, #tabbar { display: none; }
input, select, textarea { max-width: 100%; }
.tile.btn { white-space: normal; overflow-wrap: anywhere; }
.qr { width: min(280px, 100%); background: #fff; padding: 8px; border-radius: 12px; }
body.remote a[href="#restore"], body.remote a[href="#migrate"], body.remote a[href="#schedule"], body.remote #dexp,
body.remote .row:has(#bexp), body.remote .row:has(#bout), body.remote .row:has(#lout),
body.remote #lrest, body.remote #lext, body.remote #lshow, body.remote #ldel, body.remote [data-item], body.remote [data-cat],
body.remote #cadd, body.remote #cform, body.remote [data-e], body.remote [data-x], body.remote [data-dr], body.remote [data-dl], body.remote [data-dd] { display: none !important; }
@media (max-width: 1100px) and (min-width: 821px) {
  aside { width: 180px; } #jobbar { left: 180px; } main { padding: 22px 20px 120px; }
}
@media (max-width: 820px) {
  body { display: block; min-height: 100dvh; }
  aside { display: none; }
  #topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 4; background: var(--side); border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); }
  #topbar .logo { width: 26px; height: 26px; } #topbar b { font-size: 16px; }
  #tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--side); border-top: 1px solid var(--line);
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #tabbar a, #tabbar button { flex: 1; min-width: 0; min-height: 54px; display: flex; align-items: center; justify-content: center; text-align: center;
    border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: none; padding: 4px 2px; }
  #tabbar .active { color: var(--accent); font-weight: 600; }
  main { max-width: none; overflow-wrap: anywhere;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 22px; }
  #jobbar { left: 0; bottom: calc(54px + env(safe-area-inset-bottom)); flex-wrap: wrap; gap: 8px; padding: 8px 16px; }
  #jobbar .txt { min-width: 0; max-width: none; width: 100%; }
  td[style*="nowrap"] { white-space: normal !important; }
  .btn { min-height: 44px; white-space: normal; } .btn.small { min-height: 38px; padding: 6px 12px; font-size: 13px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: inherit; }
  input[type=text], input[type=password], input[type=number], select { font-size: 16px; min-height: 44px; }
  input[type=checkbox], input[type=radio] { width: 20px; height: 20px; flex: none; }
  .row .grow, .row > select { flex: 1 1 100%; min-width: 0; }
  .row > label.k { min-width: 100%; margin-bottom: -4px; }
  .row > .btn { flex: 1 1 auto; }
  label.opt { min-height: 32px; }
  .card { padding: 14px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); }
  .split { grid-template-columns: 1fr; }
  .tree { max-height: none; }
  .tree summary { flex-wrap: wrap; padding: 12px 10px; }
  .tree .item { flex-wrap: wrap; padding: 10px; }
  .tree .item > span:not(.meta) { flex: 1; min-width: 0; }
  .tree .item .meta { width: 100%; margin-left: 28px; }
  .files .f { padding: 8px 10px 8px 16px; } .files .i { padding: 8px 10px; flex-wrap: wrap; }
  .pane { height: 48vh !important; }
  .wiznav { flex-wrap: wrap; } .wiznav .grow { flex-basis: 100%; height: 0; }
  .choice { padding: 14px; }
  #toasts { left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); } .toast { max-width: none; }
  .modal-back { place-items: end stretch; padding: 0; }
  .modal { width: 100%; max-height: 92dvh; border-radius: 16px 16px 0 0; }
  .modal footer { flex-wrap: wrap; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .modal footer .btn { flex: 1 1 auto; }
}
@media (max-width: 640px) {
  .scroll { max-height: none !important; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: auto !important; }
  table.cards thead { display: none; }
  table.cards tr { padding: 8px 0; border-bottom: 1px solid var(--line); }
  table.cards td { border: 0; padding: 3px 8px; text-align: left; white-space: normal !important; }
  table.cards td[data-label]:not([data-label=""])::before { content: attr(data-label); display: block; font-size: 11px; color: var(--muted); }
  table.cards td .btn { margin: 3px 2px; }
}
</style>

<body>
<header id="topbar"><div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M4 10h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><rect x="9.5" y="12" width="5" height="1.6" rx=".8" fill="#c2410c"/></svg></div><b>Claude Backup</b></header>
<aside>
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M4 10h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><rect x="9.5" y="12" width="5" height="1.6" rx=".8" fill="#c2410c"/></svg></div>
    <div><b>Claude Backup</b><small>v__VERSION__</small></div></div>
  <nav id="nav"></nav>
  <div class="grow"></div>
  <div class="foot" id="foot"></div>
</aside>
<main id="main"></main>
<div id="jobbar"><div class="txt" id="jobtxt"></div><div class="bar"><div id="jobfill"></div></div><button class="btn small" id="jobcancel">Cancel</button></div>
<nav id="tabbar" aria-label="Main"></nav>
<div id="toasts"></div>

<script>
const TOKEN = "__TOKEN__";
const CATS = ["skills", "plugins", "prompts", "artifacts", "settings", "history"];
const CAT = {skills: "Skills", plugins: "Plugins", prompts: "Prompts", artifacts: "Artifacts", settings: "Settings", history: "History"};
const PAGES = [["dashboard", "Dashboard"], ["backup", "Back up"], ["restore", "Restore"], ["migrate", "Move accounts"],
  ["library", "Library"], ["cloud", "Cloud & drives"], ["artifacts", "Artifacts"], ["schedule", "Automatic"], ["undo", "Undo & activity"],
  ["settings", "Settings"], ["help", "Help"]];
let S = null;            // latest scan
const state = {restore: {path: null}, library: {path: null}, artifacts: {zip: "", rows: [], sel: new Set()}, wiz: null};

// ---------- utilities ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const size = n => n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB";
const short = u => u ? u.slice(0, 8) + "…" : "—";
const when = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString([], {dateStyle: "medium", timeStyle: "short"}); };
const acctLabel = a => [a.email, `account ${short(a.account)} · org ${short(a.org)}`, a.user_skills ? a.user_skills + " skills" : "", a.current ? "signed in" : ""].filter(Boolean).join("  ·  ");

async function api(path, body = {}) {
  let r;
  try { r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN}, body: JSON.stringify(body)}); }
  catch { throw new Error(REMOTE ? "Can't reach your computer. Check it's awake, on the same Wi-Fi, and Claude Backup is running." : "The app stopped responding. Reopen Claude Backup."); }
  let j; try { j = await r.json(); } catch { throw new Error("The app stopped responding. Reopen Claude Backup."); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, kind = "") {
  const t = document.createElement("div"); t.className = "toast " + kind; t.innerHTML = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), kind === "bad" ? 9000 : 5000);
}
const fail = e => toast(esc(e.message || e), "bad");
async function runJob(path, body) {
  const {job} = await api(path, body);
  $("#jobbar").classList.add("on"); $("#jobfill").style.width = "0";
  $("#jobcancel").onclick = () => api("/api/job/cancel", {id: job});
  try {
    while (true) {
      await new Promise(r => setTimeout(r, 220));
      const j = await api("/api/job", {id: job});
      $("#jobtxt").textContent = `${j.title}… ${j.total ? j.done + "/" + j.total + "  " + j.label : ""}`;
      $("#jobfill").style.width = j.total ? (100 * j.done / j.total) + "%" : "15%";
      if (j.state === "done") return j.result;
      if (j.state === "cancelled") throw new Error("Cancelled");
      if (j.state === "error") throw new Error(j.error);
    }
  } finally { $("#jobbar").classList.remove("on"); }
}
function modal(title, bodyHtml, buttons = [["Close", null, "primary"]]) {
  return new Promise(resolve => {
    const back = document.createElement("div"); back.className = "modal-back";
    back.innerHTML = `<div class="modal"><header><h2>${title}</h2></header><div class="body">${bodyHtml}</div><footer></footer></div>`;
    for (const [label, value, cls] of buttons) {
      const b = document.createElement("button"); b.className = "btn " + (cls || ""); b.textContent = label;
      b.onclick = () => { back.remove(); resolve(value); }; $("footer", back).append(b);
    }
    back.onclick = e => { if (e.target === back) { back.remove(); resolve(null); } };
    document.body.append(back);
  });
}
const confirmBox = (title, text, ok = "Continue") => modal(title, `<p>${text}</p>`, [["Cancel", false], [ok, true, "primary"]]);
async function pickInto(kind, input) { const r = await api("/api/pick", {kind}); if (r.path) { input.value = r.path; input.dispatchEvent(new Event("change")); } return r.path; }
const reveal = p => api("/api/reveal", {path: p}).catch(fail);
const openUrl = u => window.open(u, "_blank", "noopener");

// ---------- checkbox tree ----------
function renderTree(el, groups, onChange) {
  el.classList.add("tree");
  el.innerHTML = groups.length ? groups.map(g => `<details data-g="${esc(g.id)}"${g.open ? " open" : ""}><summary><span class="chev">▸</span><input type="checkbox" data-group>
      <span>${esc(g.label)}</span><span class="meta">${esc(g.meta || "")}</span></summary>
      ${g.items.map(i => `<label class="item"><input type="checkbox" value="${esc(i.id)}" ${i.checked !== false ? "checked" : ""}>
        <span>${esc(i.label)}${i.sub ? `<small>${esc(i.sub)}</small>` : ""}</span><span class="meta">${esc(i.meta || "")}</span></label>`).join("")}</details>`).join("")
    : `<div class="empty">Nothing here.</div>`;
  const sync = (notify = true) => {
    $$("details", el).forEach(d => {
      const items = $$(".item input", d), n = items.filter(i => i.checked).length, g = $("[data-group]", d);
      g.checked = n === items.length && n > 0; g.indeterminate = n > 0 && n < items.length;
    });
    if (notify && onChange) onChange();
  };
  $$("[data-group]", el).forEach(g => {
    g.onclick = e => e.stopPropagation();
    g.onchange = () => { $$(".item input", g.closest("details")).forEach(i => i.checked = g.checked); sync(); };
  });
  $$(".item input", el).forEach(i => i.onchange = () => sync());
  sync(false);
  if (onChange) setTimeout(onChange);   // after the caller has the returned handle
  return {
    checked: () => $$(".item input", el).filter(i => i.checked).map(i => i.value),
    all: v => { $$(".item input", el).forEach(i => i.checked = v); sync(); },
  };
}
const catGroups = (items, open = false) => CATS.map(c => {
  const its = items.filter(i => i.category === c);
  if (!its.length) return null;
  const files = its.reduce((a, i) => a + (i.files || 0), 0), bytes = its.reduce((a, i) => a + (i.bytes || 0), 0);
  return {id: c, label: CAT[c], open, meta: `${its.length} items · ${size(bytes)}`,
    items: its.map(i => ({id: i.id, label: i.title, sub: (i.description || "").slice(0, 110), meta: `${i.files} files · ${size(i.bytes)}`}))};
}).filter(Boolean);

// ---------- routing ----------
const REMOTE = "__REMOTE__" === "1";
if (REMOTE) { document.body.classList.add("remote"); PAGES.splice(0, PAGES.length, ["dashboard", "Dashboard"], ["backup", "Back up"], ["library", "Library"], ["cloud", "Cloud & drives"], ["help", "Help"]); }
else PAGES.splice(PAGES.findIndex(p => p[0] === "settings"), 0, ["phone", "Phone"]);
const TABS = [["dashboard", "Home"], ["backup", "Back up"], ["library", "Library"], ["cloud", "Cloud"], REMOTE ? ["help", "Help"] : ["more", "More"]];

async function doBackup(body) {
  try {
    const r = await runJob("/api/backup", body);
    const copies = (r.copies || []).map(c => `<div class="note ${c.ok ? "ok" : "bad"}">${c.ok ? "Copied to" : "Couldn't copy to"} <b>${esc(c.name)}</b>: ${esc(c.message)}</div>`).join("");
    const go = await modal("Backup created", `<div class="note ok">Saved ${r.items} items (${size(r.size)}).</div><code>${esc(r.path)}</code>${copies}
      ${!(r.copies || []).length ? `<p class="muted small">Tip: keep a copy off this computer. Add an external drive or a cloud under <a href="#cloud">Cloud &amp; drives</a>.</p>` : ""}`,
      [...(REMOTE ? [] : [["Show file", "reveal"]]), ["Open in Library", "lib", "primary"]]);
    if (go === "reveal") reveal(r.path);
    if (go === "lib") { state.library.path = r.path; location.hash = "library"; }
    return r;
  } catch (e) { fail(e); }
}

function skillChecks(el, defaults) {

  return () => $$("input:checked", el).map(i => i.value);
}
function planHtml(res) {
  const counts = {}; res.actions.forEach(a => counts[a.action] = (counts[a.action] || 0) + 1);
  return `<p class="muted">Into account ${short(res.target.account)} · org ${short(res.target.org)}</p>
    <p>${Object.entries(counts).map(([k, n]) => `<span class="pill">${n} × ${esc(k)}</span>`).join(" ") || "Nothing to do."}</p>
    ${res.warnings.map(w => `<div class="note warn">${esc(w)}</div>`).join("")}
    <div class="scroll"><table><thead><tr><th>Action</th><th>File</th><th>Note</th></tr></thead><tbody>
    ${res.actions.slice(0, 1500).map(a => `<tr><td>${esc(a.action)}</td><td class="mono">${esc(a.path)}</td><td class="small">${esc(a.note)}</td></tr>`).join("")}</tbody></table></div>
    ${res.actions.length > 1500 ? `<p class="muted small">First 1,500 of ${res.actions.length} shown.</p>` : ""}`;
}
async function finishDialog(res, title = "Restore finished") {
  const files = res.out_dir ? (await api("/api/uploads", {out_dir: res.out_dir})).files : [];
  const changed = res.actions.filter(a => ["create", "overwrite", "merge into", "register in"].includes(a.action)).length;
  const html = `<div class="note ok">Restored into account ${short(res.target.account)} · org ${short(res.target.org)}. ${changed} files written or merged.</div>
    ${res.warnings.map(w => `<div class="note warn">${esc(w)}</div>`).join("")}
    ${files.length ? `<h3>Finish in Claude: upload your skills and plugins</h3>
      <p class="muted">Skills and plugins are stored in your Claude account in the cloud. Upload each file in the account you restored into, and tick it off as you go.<br>
      Skills: Settings → Capabilities → Skills → Upload. Plugins: Customize → Plugins.</p>
      <div class="row"><button class="btn primary" id="fopen">1. Open Claude skills settings</button><button class="btn" id="ffold">2. Show the upload files</button></div>
      <div class="scroll"><table><tbody>${files.map(f => `<tr><td style="width:30px"><input type="checkbox" data-f="${esc(f.path)}" ${f.done ? "checked" : ""}></td><td>${esc(f.name)}</td><td><span class="pill">${f.kind}</span></td><td class="num"><button class="btn small" data-rv="${esc(f.path)}">Show</button></td></tr>`).join("")}</tbody></table></div>
      <p class="muted small" id="fcount"></p>` : ""}`;
  const p = modal(title, html, [...(res.snapshot ? [["Undo this restore", "undo", "danger"]] : []), ...(res.out_dir ? [["Open exported files", "out"]] : []), ["Done", null, "primary"]]);
  const count = () => { const c = $$("[data-f]"); if ($("#fcount")) $("#fcount").textContent = `${c.filter(x => x.checked).length} of ${c.length} uploaded`; };
  if ($("#fopen")) { $("#fopen").onclick = () => openUrl(S.skills_url); $("#ffold").onclick = () => reveal(res.out_dir); }
  $$("[data-f]").forEach(c => c.onchange = () => { api("/api/uploads/mark", {out_dir: res.out_dir, file: c.dataset.f, done: c.checked}); count(); });
  $$("[data-rv]").forEach(b => b.onclick = () => reveal(b.dataset.rv));
  count();
  const v = await p;
  if (v === "out") reveal(res.out_dir);
  if (v === "undo" && await confirmBox("Undo restore", "Put back every file this restore changed, and remove the files it added?", "Undo")) {
    const r = await api("/api/undo", {snapshot: res.snapshot}); toast(`Undone: put back ${r.restored} files, removed ${r.removed}.`, "ok");
  }
}

      <div class="card"><h2>3. Restore into</h2>

  const skills = skillChecks($("#rsk"), S.settings.skill_targets || ["claude-code", "upload"]);
  const fillTargets = () => {
    $("#rtgt").innerHTML = S.accounts.map((a, i) => `<option value="${i}" ${a.current ? "selected" : ""}>${esc(acctLabel(a))}</option>`).join("") + `<option value="custom">Another account (enter its IDs)…</option>`;

  };

  $("#rtgt").onchange = () => $("#rcust").style.display = $("#rtgt").value === "custom" ? "flex" : "none";
  $("#rref").onclick = async () => { await rescan(); fillTargets(); toast("Accounts refreshed"); };
  let tree;
  const load = async path => {
    try {
      const r = await api("/api/inspect", {path});
      state.restore.path = path;
      if (![...$("#rlist").options].some(o => o.value === path)) $("#rlist").insertAdjacentHTML("beforeend", `<option value="${esc(path)}">${esc(path.split("/").pop())}</option>`);
      $("#rlist").value = path;
      const sa = r.source_account || {}, other = S.current_account.account && sa.account && sa.account !== S.current_account.account;
      $("#rinfo").innerHTML = `<div class="note info">Made ${esc(when(r.created_at))} on <b>${esc(r.host)}</b> (${esc(r.platform)}) from ${esc(sa.email || short(sa.account))}.
        ${r.redacted ? "<br>API keys were removed from this backup; re-enter them after restoring." : ""}
        ${other ? "<br><b>This backup is from a different account.</b> Its account IDs will be rewritten to the target account's." : ""}</div>`;
      tree = renderTree($("#rtree"), catGroups(r.items));
      $("#rrest").style.display = "block";
    } catch (e) { fail(e); }
  };
  $("#rlist").onchange = () => $("#rlist").value && load($("#rlist").value);
  $("#ropen").onclick = async () => { const r = await api("/api/pick", {kind: "backup"}); if (r.path) load(r.path); };
  $("#rall").onclick = () => tree.all(true); $("#rnone").onclick = () => tree.all(false);
  const target = () => {
    const v = $("#rtgt").value;
    if (v === "custom") { const a = $("#rca").value.trim(), o = $("#rco").value.trim(); if (!a || !o) throw new Error("Enter both the account ID and the organization ID."); return [a, o]; }
    const a = S.accounts[+v]; return [a.account, a.org];
  };
  const go = async dry => {
    try {
      const items = tree.checked(); if (!items.length) return toast("Choose at least one item.", "bad");
      const body = {path: state.restore.path, items, target: target(), skills: skills(), conflict: $("input[name=rcf]:checked").value, dry_run: dry};
      await api("/api/settings", {skill_targets: body.skills});

        if (S.desktop_running && !await confirmBox("Claude Desktop is running", "Claude Desktop is open and may overwrite restored files. Quit it first for best results.", "Restore anyway")) return;
        if (!await confirmBox("Restore", `Restore ${items.length} items into account ${short(body.target[0])}? Files that change are saved to an undo snapshot first.`, "Restore")) return;

      else { await rescan(); finishDialog(res); }
    } catch (e) { fail(e); }
  };
  $("#rprev").onclick = () => go(true); $("#rgo").onclick = () => go(false);
  const start = state.restore.path || (lib.backups[0] && lib.backups[0].path);
  if (start) load(start);
};

function newWiz() {

PAGE.migrate = async m => {
  head(m, "Move to another account", "A step-by-step guide for moving your skills, prompts, settings and history to a different Claude account.");
  if (!S) await rescan();
  if (!state.wiz) state.wiz = newWiz();
  const w = state.wiz;
  const flowNew = [["Choose", stChoose], ["Cloud data", stExport], ["What to move", stWhat], ["Back up", stBackup], ["Sign in", stSignin], ["Restore", stRestore], ["Upload", stFinish]];
  const flowLocal = [["Choose", stChoose], ["Accounts", stAccounts], ["What to move", stWhat], ["Cloud data", stExport], ["Migrate", stLocal], ["Upload", stFinish]];
  const flow = () => w.mode === "new" ? flowNew : flowLocal;
  m.insertAdjacentHTML("beforeend", `<div class="steps" id="wsteps"></div><div class="card" id="wbody"></div>`);
  const render = () => {
    $("#wsteps").innerHTML = flow().map(([n], i) => `<span class="${i === w.step ? "on" : i < w.step ? "done" : ""}">${i + 1}. ${n}</span>`).join("");
    const b = $("#wbody"); b.innerHTML = "";
    flow()[w.step][1].render(b);
    b.insertAdjacentHTML("beforeend", `<div class="wiznav"><button class="btn" id="wback" ${w.step ? "" : "disabled"}>← Back</button><span class="grow"></span>
      <button class="btn" id="wreset">Start over</button><button class="btn primary" id="wnext">${w.step === flow().length - 1 ? "Finish" : "Next →"}</button></div>`);
    $("#wback").onclick = () => { w.step--; render(); };
    $("#wreset").onclick = () => { state.wiz = newWiz(); show("migrate"); };
    $("#wnext").onclick = async () => {
      const st = flow()[w.step][1];
      if (st.check && !(await st.check())) return;
      if (w.step === flow().length - 1) { state.wiz = null; location.hash = "dashboard"; return; }
      w.step++; render();
    };
  };
  const cats = () => CATS.filter(c => w.cats[c]);
  const skills = () => Object.keys(w.skills).filter(k => w.skills[k]);

  function stChoose() {}
  stChoose.render = b => {
    b.innerHTML = `<h2>Where is the account you're moving to?</h2>
      <label class="choice"><input type="radio" name="wm" value="new" ${w.mode === "new" ? "checked" : ""}><span><b>A new account, or another computer</b><br><span class="muted">Make a backup here, sign in to the new account (on this or another computer), then restore. Use this when the new account hasn't signed in to Claude Desktop on this computer yet.</span></span></label>
      <label class="choice"><input type="radio" name="wm" value="local" ${w.mode === "local" ? "checked" : ""}><span><b>An account that has already signed in on this computer</b><br><span class="muted">Copy straight from one account's folders to the other's, in one step.</span></span></label>`;
    $$("input[name=wm]", b).forEach(r => r.onchange = () => { w.mode = r.value; render(); });
  };
  function stExport() {}
  stExport.render = b => {
    b.innerHTML = `<h2>Include artifacts and chats? (optional)</h2>
      <p>Artifacts, conversations and project instructions are stored on claude.ai. To bring them along, export them from the account you're moving from:</p>
      <ol><li>Open Claude: Settings → Privacy → Export data.</li><li>Wait for the email, then download the .zip.</li><li>Choose the .zip below.</li></ol>
      <div class="row"><button class="btn" id="wexo">Open Claude export settings</button></div>
      <div class="row"><input type="text" class="grow" id="wex" placeholder="claude.ai export .zip"><button class="btn" id="wexp">Choose…</button></div>
      <p class="muted small">Skip this step if you only need local data.</p>`;
    $("#wex").value = w.export || "";
    $("#wex").onchange = () => w.export = $("#wex").value.trim();
    $("#wexo").onclick = () => openUrl(S.export_url);
    $("#wexp").onclick = () => pickInto("export", $("#wex"));
  };
  stExport.check = () => { w.export = $("#wex").value.trim(); if (w.export && !/\.zip$/i.test(w.export)) { toast("That isn't a .zip file.", "bad"); return false; } return true; };
  function stWhat() {}

PAGE.library = async m => {
  head(m, "Library", "Every backup in your backup folder. Pick one to look inside, check it, pull files out, or restore it.");
  m.insertAdjacentHTML("beforeend", `
    <div class="row"><input type="text" class="grow" id="lout"><button class="btn" id="loutp">Choose…</button><button class="btn" id="lref">Refresh</button><button class="btn" id="limp">Add backup file…</button></div>
    <div class="scroll" style="max-height:260px"><table><thead><tr><th>Created</th><th>Contents</th><th class="num">Items</th><th class="num">Size</th><th>From</th></tr></thead><tbody id="lrows"></tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="lrest" disabled>Restore…</button><button class="btn" id="lver" disabled>Verify</button><button class="btn" id="lext" disabled>Extract selected…</button><button class="btn" id="lcopy" disabled>Copy to…</button><button class="btn" id="lshow" disabled>Show file</button><button class="btn danger" id="ldel" disabled>Move to Trash</button></div>
    <div class="split"><div class="pane files" id="lfiles"><div class="empty">Select a backup to see what's inside.</div></div><div class="pane"><pre class="preview" id="lprev"></pre></div></div>`);
  const st = await api("/api/settings"); $("#lout").value = st.out;
  const load = async () => {
    const r = await api("/api/backups", {out: $("#lout").value});
    $("#lrows").innerHTML = r.backups.map(b => `<tr class="click${b.path === state.library.path ? " on" : ""}" data-p="${esc(b.path)}"><td>${esc(when(b.created_at))}</td><td>${b.categories.map(c => `<span class="pill">${c}</span>`).join("")}</td><td class="num">${b.items}</td><td class="num">${size(b.size)}</td><td>${esc(b.email || b.host)}</td></tr>`).join("")
      || `<tr><td colspan="5" class="empty">No backups in this folder yet.</td></tr>`;
    $$("#lrows tr[data-p]").forEach(tr => tr.onclick = () => select(tr.dataset.p));
    if (state.library.path && r.backups.some(b => b.path === state.library.path)) select(state.library.path);
  };
  const select = async p => {
    state.library.path = p;
    $$("#lrows tr").forEach(tr => tr.classList.toggle("on", tr.dataset.p === p));
    $$("#lrest,#lver,#lext,#lcopy,#lshow,#ldel").forEach(b => b.disabled = false);
    const c = await api("/api/contents", {path: p});
    $("#lprev").textContent = `Created ${when(c.created_at)} on ${c.host} (${c.platform})\nAccount: ${(c.source_account || {}).email || ""}\nTool version ${c.tool_version}${c.redacted ? "\nAPI keys removed" : ""}\n\nSelect a file on the left to preview it.`;
    $("#lfiles").innerHTML = CATS.map(cat => {
      const its = c.items.filter(i => i.category === cat); if (!its.length) return "";
      return `<div class="h"><label><input type="checkbox" data-cat="${cat}"> ${CAT[cat]}</label></div>` + its.map(i => `<details><summary class="i"><input type="checkbox" data-item="${esc(i.id)}" data-cat2="${cat}"> ${esc(i.title)} <span class="muted small" style="margin-left:auto">${i.nfiles} · ${size(i.bytes)}</span></summary>
        ${i.files.map(f => `<div class="f" data-i="${esc(i.id)}" data-f="${esc(f.path)}"><span>${esc(f.path)}</span><span>${size(f.size)}</span></div>`).join("")}</details>`).join("");
    }).join("");
    $$("[data-cat]").forEach(cb => cb.onchange = () => $$(`[data-cat2="${cb.dataset.cat}"]`).forEach(i => i.checked = cb.checked));
    $$("[data-item]").forEach(cb => cb.onclick = e => e.stopPropagation());
    $$(".f").forEach(f => f.onclick = async () => {
      $$(".f.on").forEach(x => x.classList.remove("on")); f.classList.add("on");
      const r = await api("/api/file", {path: p, item: f.dataset.i, file: f.dataset.f});
      $("#lprev").textContent = r.text ?? `(binary file, ${size(r.size)})`;
    });
  };
  $("#loutp").onclick = async () => { if (await pickInto("folder", $("#lout"))) load(); };
  $("#lout").onchange = load; $("#lref").onclick = load;
  $("#limp").onclick = async () => { try { const r = await api("/api/import-backup", {out: $("#lout").value}); if (r.path) { state.library.path = r.path; load(); } } catch (e) { fail(e); } };
  $("#lrest").onclick = () => { state.restore.path = state.library.path; location.hash = "restore"; };
  $("#lver").onclick = async () => { try { const r = await runJob("/api/verify", {path: state.library.path}); r.problems.length ? modal("Problems found", `<pre class="preview">${esc(r.problems.join("\n"))}</pre>`) : toast("All files match their checksums.", "ok"); } catch (e) { fail(e); } };
  $("#lext").onclick = async () => {
    const items = $$("[data-item]:checked").map(i => i.dataset.item);
    if (!items.length) return toast("Tick the items to extract under the file list.", "bad");
    try { const r = await api("/api/extract", {path: state.library.path, items}); if (r.files) toast(`Extracted ${r.files} files.`, "ok"); } catch (e) { fail(e); }
  };
  $("#lshow").onclick = () => reveal(state.library.path);
  $("#lcopy").onclick = () => copyToDialog(state.library.path);
  $("#ldel").onclick = async () => {
    if (!await confirmBox("Move to Trash", `Move this backup to the Trash?<br><code>${esc(state.library.path.split("/").pop())}</code>`, "Move to Trash")) return;
    try { await api("/api/delete-backup", {path: state.library.path}); state.library.path = null; toast("Moved to Trash.", "ok"); show("library"); } catch (e) { fail(e); }
  };
  load();
};

PAGE.artifacts = async m => {

  const A = state.artifacts;
  m.insertAdjacentHTML("beforeend", `

    $("#arows").innerHTML = rows.map(r => `<tr class="click${focus === r.file ? " on" : ""}" data-f="${esc(r.file)}"><td><input type="checkbox" ${A.sel.has(r.file) ? "checked" : ""}></td><td>${esc(r.title)}</td><td class="small">${esc(r.type)}${r.language ? " / " + esc(r.language) : ""}</td><td class="small">${esc(r.conversation || "")}</td><td class="small">${esc((r.created_at || "").slice(0, 10))}</td><td class="num">${r.versions}</td></tr>`).join("")

PAGE.schedule = async m => {
  head(m, "Automatic backups", "Back up on a schedule, even when this app is closed. Older automatic backups go to the Trash so only the newest ones are kept.");
  const s = await api("/api/schedule"); const st = await api("/api/settings");
  m.insertAdjacentHTML("beforeend", `<div class="card"><h2 id="sstat"></h2>
    <div class="row"><label class="k">How often</label><label class="opt"><input type="radio" name="sf" value="daily"> Every day</label>
      <label class="opt"><input type="radio" name="sf" value="weekly"> Every week on</label><select id="sday">${s.weekdays.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select></div>
    <div class="row"><label class="k">At</label><input type="number" id="sh" min="0" max="23" style="width:70px"> : <input type="number" id="sm" min="0" max="59" style="width:70px">
      <span class="muted small">Your computer must be awake. On macOS a missed run happens at the next wake.</span></div>
    <div class="row"><label class="k">What</label>${CATS.map(c => `<label class="opt"><input type="checkbox" data-c="${c}"> ${CAT[c]}</label>`).join("")}</div>
    <div class="row"><label class="k">Accounts</label><label class="opt"><input type="radio" name="sa" value="current"> Signed-in account</label><label class="opt"><input type="radio" name="sa" value="all"> Every account</label></div>
    <div class="row"><label class="k">Keep newest</label><input type="number" id="sk" min="1" max="365" style="width:80px"><span class="muted small">backups in the folder (older ones go to the Trash)</span></div>
    <div class="row"><label class="k">Folder</label><input type="text" class="grow" id="sout"><button class="btn" id="soutp">Choose…</button></div>
    <div class="note info">Keep-newest applies to every backup in the folder. To protect a backup, keep it in another folder.</div>
    <div class="row"><button class="btn primary" id="ssave">Save schedule</button><button class="btn" id="soff">Turn off</button><button class="btn" id="srun">Run a backup now</button><span class="grow"></span><button class="btn" id="slog">Show log</button></div></div>
    <div id="slogbox"></div>`);
  const set = s => {
    $("#sstat").textContent = "Status: " + s.describe;
    $(`input[name=sf][value=${s.frequency || "daily"}]`).checked = true;
    $("#sday").value = s.weekday || 0; $("#sh").value = s.hour ?? 2; $("#sm").value = s.minute ?? 0;
    $$("[data-c]").forEach(c => c.checked = !s.categories || s.categories.includes(c.dataset.c));
    $(`input[name=sa][value=${s.accounts === "all" ? "all" : "current"}]`).checked = true;
    $("#sk").value = s.keep || st.settings.keep || 20; $("#sout").value = s.out_dir || st.out;
  };
  set(s);
  const vals = () => {
    const cats = $$("[data-c]:checked").map(c => c.dataset.c);
    const h = +$("#sh").value, mi = +$("#sm").value, k = +$("#sk").value;
    if (!cats.length) throw new Error("Choose at least one category.");
    if (!(h >= 0 && h <= 23 && mi >= 0 && mi <= 59 && k >= 1)) throw new Error("Check the time and the number of backups to keep.");
    return {frequency: $("input[name=sf]:checked").value, weekday: +$("#sday").value, hour: h, minute: mi, keep: k, categories: cats,
      accounts: $("input[name=sa]:checked").value, out: $("#sout").value.trim()};
  };
  $("#soutp").onclick = () => pickInto("folder", $("#sout"));
  $("#ssave").onclick = async () => { try { const r = await api("/api/schedule/save", vals()); toast("Automatic backups are on: " + esc(r.describe) + ".", "ok"); set(await api("/api/schedule")); } catch (e) { fail(e); } };
  $("#soff").onclick = async () => { await api("/api/schedule/off"); toast("Automatic backups are off."); set(await api("/api/schedule")); };
  $("#srun").onclick = async () => { try { const v = vals(); doBackup({categories: v.categories, accounts: v.accounts, out: v.out, keep: v.keep, label: "auto"}); } catch (e) { fail(e); } };
  $("#slog").onclick = async () => { const r = await api("/api/schedule/log", {out: $("#sout").value}); $("#slogbox").innerHTML = `<div class="card"><h2>Automatic backup log</h2><div class="pane" style="height:260px"><pre class="preview">${esc(r.text || "The schedule hasn't run yet.")}</pre></div></div>`; };
};

PAGE.undo = async m => {
  head(m, "Undo & activity", "Before every restore, the files it will change are saved here. Undo puts them back and removes the files the restore added.");
  const r = await api("/api/snapshots"), act = await api("/api/activity");
  const stamp = n => { const x = n.match(/(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/); return x ? when(`${x[1]}-${x[2]}-${x[3]}T${x[4]}:${x[5]}:${x[6]}`) : n; };
  m.insertAdjacentHTML("beforeend", `<div class="card"><h2>Restores you can undo</h2>
    <table><thead><tr><th>Restore made</th><th class="num">Files</th><th class="num">Size</th><th></th></tr></thead><tbody>
    ${r.snapshots.map(s => `<tr><td>${esc(stamp(s.name))}<br><span class="muted small mono">${esc(s.name)}</span></td><td class="num">${s.files ?? "?"}</td><td class="num">${size(s.size)}</td>
      <td class="num"><button class="btn small primary" data-u="${esc(s.path)}">Undo</button> <button class="btn small" data-d="${esc(s.path)}">What it changed</button> <button class="btn small danger" data-x="${esc(s.path)}">Delete</button></td></tr>`).join("")

        endpoint: val("#fendpoint"), remote: val("#fremote"), container_url: val("#fsas") ? val("#fsas") : (d || {}).container_url, sas: undefined};
      if (type === "s3") {
        if (($("input[name=fcred]:checked") || {}).value === "profile") { body.profile = val("#fprofile") || "default"; body.access_key = ""; }
        else { body.access_key = val("#fak"); body.secret_key = val("#fsk"); body.profile = ""; }
      }
      if (type === "azure" && !val("#fsas") && !(d && d.container_url)) return toast("Paste the Blob SAS URL.", "bad");
      if (type === "folder" && !body.path) return toast("Choose a folder.", "bad");
      if (type === "s3" && !body.bucket) return toast("Enter the bucket name.", "bad");
      if (type === "rclone" && !(body.remote || "").includes(":")) return toast("Enter a remote like  gdrive:Claude Backups", "bad");
      try {
        const saved = (await api("/api/destinations/save", body)).destination;
        try { const t = await runJob("/api/destinations/test", {id: saved.id}); toast(`${esc(saved.name)}: ${esc(t.message)}`, "ok"); }
        catch (e) { toast(`Saved, but the test failed: ${esc(e.message)}`, "bad"); }
        show("cloud");
      } catch (e) { fail(e); }
    };
    box.scrollIntoView({behavior: "smooth"});
  };
  kind ? drawForm({}) : drawKinds();
}

// ---------- help ----------
function md(src) {
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\[([^\]]+)\]\(#([^)\s]+)\)/g, '<a href="#help" data-anchor="$2">$1</a>');
  const lines = src.split("\n"), out = []; let i = 0;
  const slug = t => t.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) { const buf = []; i++; while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]); i++; out.push(`<pre class="preview" style="background:var(--bg);border-radius:8px">${esc(buf.join("\n"))}</pre>`); continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { const n = h[1].length; out.push(`<h${n + 1} id="h-${slug(h[2])}" style="margin-top:${n < 3 ? 26 : 16}px">${inline(h[2])}</h${n + 1}>`); i++; continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out.push(`<table style="margin:8px 0"><thead><tr>${cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`); continue; }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) { const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i])) { let t = lines[i++].replace(/^\s*([-*]|\d+\.)\s/, ""); while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i])) t += " " + lines[i++].trim(); items.push(t); }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(t => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue; }
    if (l.startsWith(">")) { const buf = []; while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<div class="note info">${inline(buf.join(" "))}</div>`); continue; }
    if (!l.trim()) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^(#|```|\||>|\s*([-*]|\d+\.)\s)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}
PAGE.help = async m => {
  const r = await api("/api/help");
  const toc = [...r.text.matchAll(/^##\s+(.*)$/gm)].map(x => x[1]);
  const slug = t => t.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  m.insertAdjacentHTML("beforeend", `<div class="row"><input type="text" class="grow" id="hq" placeholder="Search the guide"></div>
    <div class="card small">${toc.map(t => `<a href="#help" data-anchor="${slug(t)}" style="margin-right:14px;white-space:nowrap">${esc(t)}</a>`).join(" ")}</div>
    <div class="card" id="hbody">${md(r.text)}</div>`);
  m.addEventListener("click", e => { const a = e.target.closest("[data-anchor]"); if (a) { e.preventDefault(); const el = document.getElementById("h-" + a.dataset.anchor); el && el.scrollIntoView({behavior: "smooth"}); } });
  $("#hq").oninput = () => {
    const q = $("#hq").value.toLowerCase(); $$("#hbody > *").forEach(el => el.style.display = !q || el.textContent.toLowerCase().includes(q) ? "" : "none");
  };
};

setInterval(() => api("/api/heartbeat").catch(() => {}), 20000);
show(location.hash.slice(1));
</script>
